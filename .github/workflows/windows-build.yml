name: Windows build

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.11.1
      - name: Build executable
        run: >-
          python -m PyInstaller --onefile --console --name typer_bot
          --collect-all rapidocr_onnxruntime --collect-binaries onnxruntime
          typer_bot.py
      - name: Write SHA-256 manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/typer_bot.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  typer_bot.exe" | Set-Content dist/SHA256SUMS.txt
      - name: Upload executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: typer_bot-windows
          path: |
            dist/typer_bot.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
